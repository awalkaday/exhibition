# .github/workflows/deploy.yml
#
# Builds the Simulation #2 app first, replaces its own source folder with the
# built output, then runs the Jekyll build — which now picks up simulation-2/
# as an ordinary static folder and copies it into _site/simulation-2/ as part
# of its own build. Jekyll is the only step that ever writes into _site/.
#
# That ordering isn't cosmetic: actions/jekyll-build-pages runs Jekyll inside a
# Docker container, and the _site/ it produces commonly comes out owned by
# root — a later step trying to mkdir/cp into it as the runner user fails with
# "permission denied". Writing into _site/ after Jekyll has run is the bug;
# never doing that is the fix, regardless of the exact ownership Jekyll leaves
# behind.
#
# One-time manual step this requires: in the repo's Settings > Pages, switch the
# deployment source from "Deploy from a branch" to "GitHub Actions". The classic
# Jekyll auto-build only publishes the Jekyll pages — it never runs the Vite build,
# so simulation-2/ would 404 without this switch.

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simulation-2/package-lock.json

      - name: Build Simulation #2
        working-directory: simulation-2
        run: |
          npm ci
          npm run build

      - name: Replace the app's source with its build output
        run: |
          rm -rf simulation-2
          mv simulation-2-build simulation-2

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
